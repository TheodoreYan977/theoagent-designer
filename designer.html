<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheoAgent 图文设计器</title>
<style>
  :root{--bg:#1f1f1f;--panel:#2a2a2a;--line:#3a3a3a;--ink:#e8e6e1;--muted:#9a978f;--accent:#facbc6;--moss:#8fb79a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  @font-face{font-family:'Smiley';src:url('/fonts/SmileySans.ttf') format('truetype');font-weight:400;}
  @font-face{font-family:'NotoSerif';src:url('/fonts/NotoSerif-VF.ttf') format('truetype');font-weight:100 900;}
  @font-face{font-family:'NotoSans';src:url('/fonts/NotoSans-VF.ttf') format('truetype');font-weight:100 900;}
  @font-face{font-family:'NotoSC';src:url('/fonts/NotoSansSC-VF.ttf') format('truetype');font-weight:100 900;}
  html,body{height:100%;}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;}
  header .brand{font-family:'Smiley';font-size:20px;color:var(--accent);}
  .tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:8px;flex-wrap:wrap;align-items:center;}
  .tab{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none;}
  .tab.active{background:#3a3a3a;color:var(--ink);}
  .tab .del{opacity:.5;font-size:14px;padding:0 2px;line-height:1;}
  .tab .del:hover{opacity:1;color:#ff9b9b;}
  .tab.add{color:var(--moss);font-weight:600;border:1px dashed var(--line);}
  .spacer{flex:1;}
  button.tool{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
  button.tool:hover{border-color:var(--moss);}
  button.tool.primary{background:var(--moss);border-color:var(--moss);color:#12231a;font-weight:600;}
  main{flex:1;display:flex;min-height:0;}
  #canvas{flex:1;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding:24px;}
  #stage{position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5);flex:0 0 auto;}
  #board{position:absolute;left:0;top:0;transform-origin:0 0;}
  #board .el{position:absolute;cursor:move;}
  #board .el.selected{outline:2px solid var(--accent);outline-offset:1px;}
  #board .el:hover{outline:1px dashed var(--moss);}
  #sel-overlay{position:absolute;pointer-events:none;z-index:10;transform-origin:center;}
  #sel-overlay .rz{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);border-radius:2px;transform:translate(-50%,-50%);pointer-events:auto;}
  #sel-overlay .rz-rotate{position:absolute;left:50%;top:-30px;width:14px;height:14px;border-radius:50%;background:var(--moss);cursor:grab;transform:translate(-50%,-50%);pointer-events:auto;}
  .rz-nw{left:0;top:0;cursor:nwse-resize}.rz-n{left:50%;top:0;cursor:ns-resize}.rz-ne{left:100%;top:0;cursor:nesw-resize}
  .rz-w{left:0;top:50%;cursor:ew-resize}.rz-e{left:100%;top:50%;cursor:ew-resize}
  .rz-sw{left:0;top:100%;cursor:nesw-resize}.rz-s{left:50%;top:100%;cursor:ns-resize}.rz-se{left:100%;top:100%;cursor:nwse-resize}
  #panel{width:300px;flex:0 0 300px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);overflow:hidden;}
  #layers{flex:0 0 auto;max-height:42%;overflow-y:auto;padding:10px;border-bottom:1px solid var(--line);}
  #layers .ltitle{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px;}
  .layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;font-size:12px;color:var(--ink);cursor:pointer;user-select:none;}
  .layer:hover{background:#333;}
  .layer.sel{background:#3a3a3a;}
  .layer .ico{width:16px;text-align:center;flex:0 0 16px;opacity:.8;}
  .layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer .op{flex:0 0 auto;opacity:.6;cursor:pointer;font-size:12px;padding:0 2px;}
  .layer .op:hover{opacity:1;}
  .layer.hidden{opacity:.45;}
  #props{flex:1;overflow-y:auto;padding:14px;}
  #panel .empty{color:var(--muted);padding:20px 0;text-align:center;}
  #panel .row{margin-bottom:10px;}
  #panel label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;}
  #panel input[type=text],#panel input[type=number],#panel select,#panel textarea{width:100%;background:#1c1c1c;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;}
  #panel input[type=text],#panel input[type=number]{height:32px;}
  #panel textarea{min-height:72px;resize:vertical;font-family:inherit;line-height:1.5;}
  #panel input[type=color]{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:#1c1c1c;padding:2px;cursor:pointer;}
  #panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  #panel .inline{display:flex;gap:8px;align-items:center;}
  #panel .inline input[type=checkbox]{width:auto;}
  #panel .btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  #panel .btnrow button{flex:1;border:1px solid var(--line);background:#1c1c1c;color:var(--ink);padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12px;min-width:60px;}
  #panel .btnrow button.danger{color:#ff9b9b;border-color:#5a3232;}
  #panel .ph{display:flex;gap:6px;}
  #panel .ph select{flex:1;}
  #status{position:fixed;right:16px;bottom:16px;background:var(--moss);color:#12231a;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #status.show{opacity:1;}
  #crop-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
  #crop-modal.show{display:flex;}
  #crop-stage{position:relative;overflow:hidden;line-height:0;border:1px solid var(--line);}
  #crop-stage img{display:block;user-select:none;-webkit-user-drag:none;}
  #crop-box{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;}
  .crop-h{position:absolute;width:16px;height:16px;background:var(--accent);border-radius:3px;pointer-events:auto;touch-action:none;z-index:3;}
  .crop-h[data-c="tl"],.crop-h[data-c="br"]{cursor:nwse-resize;}
  .crop-h[data-c="tr"],.crop-h[data-c="bl"]{cursor:nesw-resize;}
  #crop-bar{display:flex;gap:12px;}
  #crop-bar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 22px;border-radius:8px;cursor:pointer;font-size:14px;}
  #crop-bar button.primary{background:var(--moss);border-color:var(--moss);color:#12231a;font-weight:600;}
  #page-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:120;}
  #page-modal.show{display:flex;}
  .pm-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:400px;display:flex;flex-direction:column;gap:12px;color:var(--ink);}
  .pm-box h3{font-size:16px;margin:0;color:var(--accent);}
  .pm-box label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
  .pm-box input,.pm-box select{width:100%;background:#1c1c1c;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;height:32px;box-sizing:border-box;}
  .pm-size{display:flex;gap:8px;}
  .pm-size label{flex:1;}
  .pm-actions{display:flex;gap:8px;justify-content:flex-end;}
  .pm-actions button{border:1px solid var(--line);background:#1c1c1c;color:var(--ink);padding:7px 16px;border-radius:6px;cursor:pointer;}
  .pm-actions button.primary{background:var(--moss);border-color:var(--moss);color:#12231a;font-weight:600;}
</style>
</head>
<body>
<header>
  <span class="brand">TheoAgent 图文设计器</span>
  <div class="tabs" id="tabs"></div>
  <span id="zoom-info" title="Ctrl+滚轮缩放，拖空白处平移，双击复位" style="font-size:12px;color:var(--muted);min-width:44px;text-align:center">100%</span>
  <div class="spacer"></div>
  <button class="tool" onclick="addElement('text')">＋文字</button>
  <button class="tool" onclick="addElement('image')">＋图片</button>
  <button class="tool" onclick="addElement('rect')">＋色块</button>
  <button class="tool" id="btn-undo" onclick="undo()">↶ 撤销</button>
  <button class="tool" id="btn-redo" onclick="redo()">↷ 重做</button>
  <button class="tool primary" onclick="save()">保存模板</button>
  <button class="tool" onclick="exportPng()">导出 PNG</button>
</header>
<main>
  <div id="canvas"><div id="stage"><div id="board"></div></div></div>
  <aside id="panel"><div id="layers"></div><div id="props"></div></aside>
</main>
<div id="status"></div>

<div id="page-modal">
  <div class="pm-box">
    <h3>新建页面</h3>
    <label>名称<input id="pm-name" type="text" value="新页面"></label>
    <label>类型<select id="pm-kind" onchange="pmKindChange()"><option value="cover">封面 1242×1660</option><option value="note">图文笔记 1080×1440</option><option value="custom">自定义</option></select></label>
    <div class="pm-size"><label>宽<input id="pm-w" type="number" value="1242"></label><label>高<input id="pm-h" type="number" value="1660"></label></div>
    <div class="pm-actions"><button onclick="closeNewPage()">取消</button><button class="primary" onclick="createPage()">创建</button></div>
  </div>
</div>

<div id="crop-modal">
  <div id="crop-stage"><img id="crop-img" alt=""><div id="crop-box"></div><div class="crop-h" data-c="tl"></div><div class="crop-h" data-c="tr"></div><div class="crop-h" data-c="bl"></div><div class="crop-h" data-c="br"></div></div>
  <div id="crop-bar"><button onclick="cropCancel()">取消</button><button class="primary" onclick="cropApply()">确定裁剪</button></div>
</div>

<script>
const FACE = { 'Smiley Sans': 'Smiley', 'Noto Serif': 'NotoSerif', 'Noto Sans': 'NotoSans', 'Noto Sans SC': 'NotoSC' };
let template = null, sample = null, activeId = 'cover', selectedId = null, selectedIds = [];
let history = [], index = -1, lastSnapKey = '', lastSnapTime = 0;
let viewZoom = 1, panX = 0, panY = 0;
const clone = (o) => JSON.parse(JSON.stringify(o));

const $ = (id) => document.getElementById(id);
const activeBoard = () => template.pages.find((a) => a.id === activeId);
const selectedEl = () => selectedId ? activeBoard().elements.find((e) => e.id === selectedId) : null;
const substitute = (s) => String(s ?? '').replace(/\{(\w+)\}/g, (m, k) => (sample && sample[k] !== undefined ? sample[k] : m));
const resolveSrc = (s) => { const v = substitute(s); if (!v) return ''; if (/^data:/.test(v) || /^(https?|file):/.test(v)) return v; return '/files/' + v.replace(/\\/g, '/'); };

/* ---- 撤销 / 重做 ---- */
function snapshot(key = '', force = false) {
  const now = Date.now();
  const merge = !force && key && key === lastSnapKey && now - lastSnapTime < 1000;
  if (merge && index >= 0) {
    history[index] = clone(template);            // 同一字段 1 秒内的连续改动合并成一步
  } else {
    history = history.slice(0, index + 1);
    history.push(clone(template));
    index = history.length - 1;
  }
  lastSnapKey = key; lastSnapTime = now;
  updateButtons();
}
function applyState(snap) {
  template = clone(snap);
  lastSnapKey = ''; lastSnapTime = 0;
  buildTabs();
  render();
  if (selectedId) {
    const el = activeBoard().elements.find((e) => e.id === selectedId);
    if (el) select(el.id); else { clearSel(); populatePanel(null); }
  } else {
    populatePanel(null);
  }
  updateButtons();
}
function undo() { if (index > 0) { index--; applyState(history[index]); } }
function redo() { if (index < history.length - 1) { index++; applyState(history[index]); } }
function updateButtons() {
  const u = $('btn-undo'), r = $('btn-redo');
  if (u) { u.disabled = index <= 0; u.style.opacity = index <= 0 ? '.4' : '1'; }
  if (r) { r.disabled = index >= history.length - 1; r.style.opacity = index >= history.length - 1 ? '.4' : '1'; }
}

function toast(msg) { const s = $('status'); s.textContent = msg; s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1800); }
const netMsg = (err) => {
  const m = String((err && err.message) || err || '');
  if (/Failed to fetch|NetworkError|Load failed|fetch failed/i.test(m)) {
    return '连不上本地服务：请确认 start.bat 窗口还开着，浏览器打开的是 http://127.0.0.1:8090';
  }
  return '上传失败：' + m;
};

function scale() {
  const ab = activeBoard();
  const c = $('canvas');
  return Math.max(0.05, Math.min((c.clientWidth - 40) / ab.width, (c.clientHeight - 40) / ab.height)) * viewZoom;
}

function elementDiv(el) {
  const d = document.createElement('div');
  d.className = 'el';
  d.dataset.id = el.id;
  const style = d.style;
  style.left = el.x + 'px'; style.top = el.y + 'px'; style.width = el.w + 'px'; style.height = el.h + 'px';
  if (el.visible === false) style.display = 'none';
  style.transform = `rotate(${el.rotate || 0}deg)`;
  if (el.type === 'image') {
    style.backgroundImage = `url("${resolveSrc(el.src)}")`;
    style.backgroundSize = el.fit === 'contain' ? 'contain' : 'cover';
    style.backgroundPosition = 'center';
    style.borderRadius = (el.radius || 0) + 'px';
  } else if (el.type === 'rect') {
    style.background = el.color || 'transparent';
    style.borderRadius = (el.radius || 0) + 'px';
    style.border = el.border || 'none';
  } else {
    d.textContent = substitute(el.content);
    style.fontFamily = `'${FACE[el.font] || 'NotoSC'}', sans-serif`;
    style.fontSize = (el.size || 28) + 'px';
    style.color = el.color || '#1F1F1F';
    style.textAlign = el.align || 'left';
    style.lineHeight = el.lineHeight || 1.4;
    style.fontWeight = el.bold ? '600' : '400';
    style.whiteSpace = 'pre-line';
    style.overflow = 'hidden';
  }
  if (selectedIds.includes(el.id)) d.classList.add('selected');
  if (el.locked) d.style.pointerEvents = 'none';
  d.addEventListener('pointerdown', (e) => onPointerDown(e, el));
  return d;
}

function render() {
  const ab = activeBoard();
  const board = $('board');
  const s = scale();
  board.style.width = ab.width + 'px';
  board.style.height = ab.height + 'px';
  board.style.background = ab.background || '#fff';
  board.style.transform = `scale(${s})`;
  $('stage').style.width = (ab.width * s) + 'px';
  $('stage').style.height = (ab.height * s) + 'px';
  applyPan();
  const zi = $('zoom-info'); if (zi) zi.textContent = Math.round(viewZoom * 100) + '%';
  board.innerHTML = '';
  for (const el of ab.elements) board.appendChild(elementDiv(el));
  renderLayers();
  renderSelection();
}

function elName(el) { return el.name || (el.type === 'text' ? '文字' : el.type === 'image' ? '图片' : '色块'); }
function renderLayers() {
  const box = $('layers'); if (!box) return;
  const ab = activeBoard();
  const rows = ab.elements.slice().reverse().map((el) =>
    `<div class="layer ${el.id === selectedId ? 'sel' : ''} ${el.visible === false ? 'hidden' : ''}" onclick="select('${el.id}')" ondblclick="renameLayer('${el.id}')" draggable="true" ondragstart="layerDragStart(event,'${el.id}')" ondrop="layerDrop(event,'${el.id}')" ondragover="event.preventDefault()" title="双击重命名">
      <span class="ico">${el.type === 'text' ? 'T' : el.type === 'image' ? '▣' : '■'}</span>
      <span class="nm">${escHtml(elName(el))}</span>
      <span class="op" title="显示/隐藏" onclick="event.stopPropagation();toggleVisible('${el.id}')">${el.visible === false ? '🚫' : '👁'}</span>
      <span class="op" title="锁定/解锁" onclick="event.stopPropagation();toggleLock('${el.id}')">${el.locked ? '🔒' : '🔓'}</span>
    </div>`
  ).join('');
  box.innerHTML = `<div class="ltitle">图层（上为顶层）</div>` + (rows || '<div class="empty" style="padding:10px 0">暂无元素</div>');
}
function renameLayer(id) { const ab = activeBoard(); const el = ab.elements.find((e) => e.id === id); if (!el) return; const v = prompt('图层名称', elName(el)); if (v === null) return; el.name = v.trim() || elName(el); snapshot('layer:rename:' + id, true); render(); }
function toggleVisible(id) { const ab = activeBoard(); const el = ab.elements.find((e) => e.id === id); if (!el) return; el.visible = el.visible === false ? true : false; snapshot('layer:visible:' + id, true); render(); }
function toggleLock(id) { const ab = activeBoard(); const el = ab.elements.find((e) => e.id === id); if (!el) return; el.locked = !el.locked; if (el.locked) { const i = selectedIds.indexOf(id); if (i >= 0) selectedIds.splice(i, 1); if (selectedId === id) selectedId = selectedIds[selectedIds.length - 1] || null; } snapshot('layer:lock:' + id, true); render(); populatePanel(selectedEl()); }
let dragLayerId = null;
function layerDragStart(e, id) { dragLayerId = id; try { e.dataTransfer.effectAllowed = 'move'; } catch (x) {} }
function layerDrop(e, targetId) {
  e.preventDefault();
  if (!dragLayerId || dragLayerId === targetId) return;
  const ab = activeBoard();
  const from = ab.elements.findIndex((x) => x.id === dragLayerId);
  const to = ab.elements.findIndex((x) => x.id === targetId);
  if (from < 0 || to < 0) return;
  const [item] = ab.elements.splice(from, 1);
  ab.elements.splice(to, 0, item);
  snapshot('layer:reorder:' + dragLayerId, true);
  dragLayerId = null;
  render();
}

function renderSelection() {
  const board = $('board');
  const old = $('sel-overlay'); if (old) old.remove();
  const el = selectedEl();
  if (!el || el.visible === false || selectedIds.length !== 1) return;
  const ov = document.createElement('div');
  ov.id = 'sel-overlay';
  ov.style.left = el.x + 'px'; ov.style.top = el.y + 'px'; ov.style.width = el.w + 'px'; ov.style.height = el.h + 'px';
  ov.style.transform = `rotate(${el.rotate || 0}deg)`;
  for (const dir of ['nw', 'n', 'ne', 'w', 'e', 'sw', 's', 'se']) {
    const h = document.createElement('div');
    h.className = 'rz rz-' + dir;
    h.addEventListener('pointerdown', (ev) => startResize(ev, el, dir));
    ov.appendChild(h);
  }
  const rh = document.createElement('div');
  rh.className = 'rz-rotate';
  rh.addEventListener('pointerdown', (ev) => startRotate(ev, el));
  ov.appendChild(rh);
  board.appendChild(ov);
}
function positionOverlay() {
  const ov = $('sel-overlay'), el = selectedEl();
  if (!ov || !el) return;
  ov.style.left = el.x + 'px'; ov.style.top = el.y + 'px'; ov.style.width = el.w + 'px'; ov.style.height = el.h + 'px';
  ov.style.transform = `rotate(${el.rotate || 0}deg)`;
}
function updateElementStyle(el) {
  const d = document.querySelector(`[data-id="${CSS.escape(el.id)}"]`);
  if (!d) return;
  d.style.left = el.x + 'px'; d.style.top = el.y + 'px'; d.style.width = el.w + 'px'; d.style.height = el.h + 'px';
  d.style.transform = `rotate(${el.rotate || 0}deg)`;
}
function startResize(e, el, dir) {
  e.stopPropagation(); e.preventDefault();
  const s = scale();
  const sx = e.clientX, sy = e.clientY;
  const o = { x: el.x, y: el.y, w: el.w, h: el.h };
  const move = (ev) => {
    const dx = (ev.clientX - sx) / s, dy = (ev.clientY - sy) / s;
    let x = o.x, y = o.y, w = o.w, h = o.h;
    if (dir.includes('e')) w = o.w + dx;
    if (dir.includes('s')) h = o.h + dy;
    if (dir.includes('w')) { w = o.w - dx; x = o.x + dx; }
    if (dir.includes('n')) { h = o.h - dy; y = o.y + dy; }
    w = Math.max(8, Math.round(w)); h = Math.max(8, Math.round(h));
    if (dir.includes('w')) x = Math.round(o.x + o.w - w);
    if (dir.includes('n')) y = Math.round(o.y + o.h - h);
    el.x = x; el.y = y; el.w = w; el.h = h;
    updateElementStyle(el); positionOverlay();
  };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); snapshot('resize:' + el.id, true); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}
function startRotate(e, el) {
  e.stopPropagation(); e.preventDefault();
  const d = document.querySelector(`[data-id="${CSS.escape(el.id)}"]`);
  if (!d) return;
  const r = d.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const startAng = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  const startRot = el.rotate || 0;
  const move = (ev) => {
    let rot = Math.round(startRot + (Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI - startAng));
    if (ev.shiftKey) rot = Math.round(rot / 15) * 15;
    el.rotate = rot;
    updateElementStyle(el); positionOverlay();
  };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); snapshot('rotate:' + el.id, true); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

function onPointerDown(e, el) {
  e.stopPropagation();
  if (e.shiftKey) { toggleSelect(el.id); return; }
  if (el.locked) { select(el.id); return; }
  select(el.id);
  const s = scale();
  const startX = e.clientX, startY = e.clientY;
  const starts = selectedEls().map((x) => ({ el: x, x: x.x, y: x.y }));
  let moved = false;
  const move = (ev) => {
    moved = true;
    const dx = Math.round((ev.clientX - startX) / s), dy = Math.round((ev.clientY - startY) / s);
    starts.forEach((st) => { st.el.x = st.x + dx; st.el.y = st.y + dy; updateElementStyle(st.el); });
    positionOverlay();
    const el0 = selectedEl();
    if (el0) { const px = $('p-x'), py = $('p-y'); if (px) px.value = el0.x; if (py) py.value = el0.y; }
  };
  const up = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    if (moved) snapshot('drag', true);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  e.preventDefault();
}

const selectedEls = () => selectedIds.map((id) => activeBoard().elements.find((e) => e.id === id)).filter(Boolean);
function applySelectionHighlight() {

}
function clearSel() { selectedId = null; selectedIds = []; applySelectionHighlight(); }

function escHtml(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function insertPh() {
  const sel = $('ph-sel'), ta = $('p-content');
  if (!sel || !ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + sel.value + ta.value.slice(end);
  ta.focus();
  commitField('content', ta.value);
}

function pickImage() { const f = $('p-file'); if (f) f.click(); }
function onFile(e) { const f = e.target.files && e.target.files[0]; if (f) uploadImage(f); e.target.value = ''; }
async function uploadImage(file) {
  if (!/^image\//.test(file.type) && !/\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)) { toast('请选择图片文件'); return; }
  toast('上传中…');
  try {
    const res = await fetch('/api/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file });
    let j = { ok: false, error: 'HTTP ' + res.status };
    try { j = await res.json(); } catch {}
    if (!j.ok) { toast('上传失败：' + (j.error || '')); return; }
    const el = selectedEl();
    commitField('src', j.path);
    if (el && el.naturalSize) {
      try { applyNaturalSize(await naturalSize(file)); } catch {}
    }
    const thumb = $('p-thumb');
    if (thumb) thumb.innerHTML = '<img src="' + resolveSrc(j.path) + '" style="max-width:100%;max-height:90px;border-radius:6px;opacity:.9">';
    const inp = $('p-src'); if (inp) inp.value = j.path;
    toast('已上传');
  } catch (err) { toast(netMsg(err)); }
}
function naturalSize(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { const w = img.naturalWidth, h = img.naturalHeight; URL.revokeObjectURL(url); (w && h) ? resolve({ w, h }) : reject(new Error('no size')); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function applyNaturalSize(n) {
  commitField('w', n.w); commitField('h', n.h);
  const pw = $('p-w'), phh = $('p-h');
  if (pw) pw.value = n.w; if (phh) phh.value = n.h;
}
async function toggleNatural(checked) {
  const el = selectedEl();
  if (!el) return;
  commitField('naturalSize', checked);
  if (checked && el.src) {
    const img = new Image();
    img.onload = () => { if (el.naturalSize) applyNaturalSize({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.src = resolveSrc(el.src);
  }
}

let crop = null;
function openCrop() {
  const el = selectedEl();
  if (!el || el.type !== 'image') return;
  if (!el.src) { toast('先选一张图片'); return; }
  const src = resolveSrc(el.src);
  const img = new Image();
  img.onload = () => {
    const maxW = window.innerWidth * 0.82, maxH = window.innerHeight * 0.7;
    const s = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    const dispW = Math.max(1, Math.round(img.naturalWidth * s)), dispH = Math.max(1, Math.round(img.naturalHeight * s));
    crop = { img, dispW, dispH, box: { x: 0, y: 0, w: dispW, h: dispH } };
    const ci = $('crop-img'); ci.src = src; ci.style.width = dispW + 'px'; ci.style.height = dispH + 'px';
    const stage = $('crop-stage'); stage.style.width = dispW + 'px'; stage.style.height = dispH + 'px';
    $('crop-modal').classList.add('show');
    drawCropBox();
  };
  img.onerror = () => toast('图片加载失败');
  img.src = src;
}
function drawCropBox() {
  if (!crop) return;
  const b = crop.box, box = $('crop-box');
  box.style.left = b.x + 'px'; box.style.top = b.y + 'px'; box.style.width = b.w + 'px'; box.style.height = b.h + 'px';
  const HS = 16;
  const setH = (c, left, top) => { const h = document.querySelector(`.crop-h[data-c="${c}"]`); if (h) { h.style.left = left + 'px'; h.style.top = top + 'px'; } };
  setH('tl', b.x, b.y);
  setH('tr', b.x + b.w - HS, b.y);
  setH('bl', b.x, b.y + b.h - HS);
  setH('br', b.x + b.w - HS, b.y + b.h - HS);
}
function cropCancel() { $('crop-modal').classList.remove('show'); crop = null; }
async function cropApply() {
  if (!crop) return;
  const el = selectedEl();
  if (!el) return;
  const scale = crop.img.naturalWidth / crop.dispW;
  const b = crop.box;
  const sx = Math.round(b.x * scale), sy = Math.round(b.y * scale);
  const sw = Math.max(1, Math.round(b.w * scale)), sh = Math.max(1, Math.round(b.h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = sw; canvas.height = sh;
  canvas.getContext('2d').drawImage(crop.img, sx, sy, sw, sh, 0, 0, sw, sh);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  if (!blob) { toast('裁剪失败'); return; }
  try {
    const res = await fetch('/api/upload?name=cropped.png', { method: 'POST', body: blob });
    const j = await res.json();
    if (!j.ok) { toast('上传裁剪图失败'); return; }
    if (!el.preCropSrc) el.preCropSrc = el.src;
    commitField('src', j.path);
    const ar = sw / sh;
    let nw = el.w, nh = el.w / ar;
    const ab = activeBoard();
    if (nh > ab.height) { nh = ab.height; nw = ab.height * ar; }
    if (nw > ab.width) { nw = ab.width; nh = ab.width / ar; }
    commitField('w', Math.max(1, Math.round(nw)));
    commitField('h', Math.max(1, Math.round(nh)));
    const pw = $('p-w'), phh = $('p-h'); if (pw) pw.value = el.w; if (phh) phh.value = el.h;
    toast('已裁剪');
  } catch (err) { toast(netMsg(err)); return; }
  cropCancel();
}
function restoreOriginal() {
  const el = selectedEl();
  if (!el || !el.preCropSrc) return;
  const orig = el.preCropSrc;
  el.preCropSrc = '';
  commitField('src', orig);
  toast('已恢复原图');
}
(function initCrop() {
  const stage = $('crop-stage');
  const rel = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    if (!crop) return;
    const p = rel(e), b = crop.box;
    const hEl = e.target.closest ? e.target.closest('.crop-h') : null;
    if (hEl) drag = { mode: 'resize', corner: hEl.dataset.c, sx: p.x, sy: p.y, b: { ...b } };
    else if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) drag = { mode: 'move', sx: p.x, sy: p.y, b: { ...b } };
    else drag = { mode: 'draw', sx: p.x, sy: p.y };
    e.preventDefault();
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag || !crop) return;
    const p = rel(e), b = crop.box;
    if (drag.mode === 'draw') {
      const x = Math.min(drag.sx, p.x), y = Math.min(drag.sy, p.y);
      const w = Math.abs(p.x - drag.sx), h = Math.abs(p.y - drag.sy);
      crop.box = { x: clamp(x, 0, crop.dispW), y: clamp(y, 0, crop.dispH), w: clamp(w, 4, crop.dispW - Math.min(x, crop.dispW)), h: clamp(h, 4, crop.dispH - Math.min(y, crop.dispH)) };
    } else if (drag.mode === 'move') {
      b.x = clamp(drag.b.x + (p.x - drag.sx), 0, crop.dispW - b.w);
      b.y = clamp(drag.b.y + (p.y - drag.sy), 0, crop.dispH - b.h);
    } else if (drag.mode === 'resize') {
      const o = drag.b, c = drag.corner;
      const right = o.x + o.w, bottom = o.y + o.h;
      const px = clamp(p.x, 0, crop.dispW), py = clamp(p.y, 0, crop.dispH);
      let nx = o.x, ny = o.y, nw = o.w, nh = o.h;
      if (c === 'tl') { nx = Math.min(px, right - 8); ny = Math.min(py, bottom - 8); nw = right - nx; nh = bottom - ny; }
      else if (c === 'tr') { ny = Math.min(py, bottom - 8); nw = clamp(px - o.x, 8, crop.dispW - o.x); nh = bottom - ny; }
      else if (c === 'bl') { nx = Math.min(px, right - 8); nw = right - nx; nh = clamp(py - o.y, 8, crop.dispH - o.y); }
      else { nw = clamp(px - o.x, 8, crop.dispW - o.x); nh = clamp(py - o.y, 8, crop.dispH - o.y); }
      crop.box = { x: nx, y: ny, w: nw, h: nh };
    }
    drawCropBox();
  });
  window.addEventListener('pointerup', () => { drag = null; });
})();

function commitField(key, value) {
  const el = selectedEl();
  if (!el) return;
  el[key] = value;
  snapshot(key + ':' + el.id);
  // 直接刷新该元素 div，避免整块重渲染丢焦点
  const d = document.querySelector(`[data-id="${CSS.escape(el.id)}"]`);
  if (d) {
    if (el.type === 'text') {
      if (key === 'content') d.textContent = substitute(el.content);
      if (['font'].includes(key)) d.style.fontFamily = `'${FACE[el.font] || 'NotoSC'}', sans-serif`;
      if (['size'].includes(key)) d.style.fontSize = (el.size || 28) + 'px';
      if (['color'].includes(key)) d.style.color = el.color;
      if (['align'].includes(key)) d.style.textAlign = el.align;
      if (['lineHeight'].includes(key)) d.style.lineHeight = el.lineHeight;
      if (['bold'].includes(key)) d.style.fontWeight = el.bold ? '600' : '400';
    } else if (el.type === 'image') {
      if (['src', 'fit'].includes(key)) { d.style.backgroundImage = `url("${resolveSrc(el.src)}")`; d.style.backgroundSize = el.fit === 'contain' ? 'contain' : 'cover'; }
      if (['radius'].includes(key)) d.style.borderRadius = (el.radius || 0) + 'px';
    } else if (el.type === 'rect') {
      if (['color'].includes(key)) d.style.background = el.color;
      if (['radius'].includes(key)) d.style.borderRadius = (el.radius || 0) + 'px';
      if (['border'].includes(key)) d.style.border = el.border || 'none';
    }
    if (['x'].includes(key)) d.style.left = el.x + 'px';
    if (['y'].includes(key)) d.style.top = el.y + 'px';
    if (['w'].includes(key)) d.style.width = el.w + 'px';
    if (['h'].includes(key)) d.style.height = el.h + 'px';
  }
}

function commitSize(key, value) {
  const el = selectedEl();
  if (!el || !(value > 0)) return;
  const ratio = (el.w && el.h) ? el.w / el.h : 1;
  el[key] = value;
  if (el.ratioLock) {
    if (key === 'w') el.h = Math.max(1, Math.round(value / ratio));
    else el.w = Math.max(1, Math.round(value * ratio));
  }
  snapshot(key + ':' + el.id);
  const d = document.querySelector(`[data-id="${CSS.escape(el.id)}"]`);
  if (d) { d.style.width = el.w + 'px'; d.style.height = el.h + 'px'; }
  const pw = $('p-w'), phh = $('p-h');
  if (pw) pw.value = el.w; if (phh) phh.value = el.h;
}
function toggleRatio() {
  const el = selectedEl();
  if (!el) return;
  el.ratioLock = !el.ratioLock;
  snapshot('ratioLock:' + el.id);
  populatePanel(el);
}

function addElement(type) {
  const ab = activeBoard();
  const n = ab.elements.length;
  const el = { id: type + '-' + Date.now().toString(36), type, x: 100, y: 100, w: 400, h: 120, font: 'Smiley Sans', size: 40, color: '#1F1F1F', align: 'left', lineHeight: 1.3, bold: false, content: '新文字', radius: 0, border: 'none', src: '', fit: 'cover', naturalSize: type === 'image' };
  ab.elements.push(el);
  snapshot('add:' + el.id, true);
  render();
  select(el.id);
}

function reorder(dir) {
  const ab = activeBoard();
  const i = ab.elements.findIndex((e) => e.id === selectedId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= ab.elements.length) return;
  [ab.elements[i], ab.elements[j]] = [ab.elements[j], ab.elements[i]];
  snapshot('reorder:' + selectedId, true);
  render();
  select(selectedId);
}

function del() {
  const ab = activeBoard();
  const ids = selectedIds.length ? selectedIds.slice() : (selectedId ? [selectedId] : []);
  if (!ids.length) return;
  ab.elements = ab.elements.filter((e) => !ids.includes(e.id));
  clearSel();
  snapshot('del', true);
  render();
  populatePanel(null);
}

function buildTabs() {
  const tabs = template.pages.map((a) =>
    `<span class="tab ${a.id === activeId ? 'active' : ''}" onclick="switchBoard('${a.id}')" ondblclick="renamePage('${a.id}')" title="双击重命名">${escHtml(a.name)}<span class="del" onclick="event.stopPropagation();delPage('${a.id}')" title="删除页面">×</span></span>`
  ).join('');

}

function openNewPage() {

  $('pm-kind').value = 'cover';

}
function closeNewPage() { $('page-modal').classList.remove('show'); }
function pmKindChange() {

  else if (k === 'note') { $('pm-w').value = 1080; $('pm-h').value = 1440; }

function createPage() {

function renamePage(id) {
  const page = template.pages.find((p) => p.id === id);
  if (!page) return;
  const name = prompt('页面名称', page.name);
  if (name === null) return;
  const v = name.trim();
  if (!v) return;
  page.name = v;
  snapshot('page:rename:' + id, true);
  buildTabs();
  toast('已重命名');
}
function delPage(id) {
  if (template.pages.length <= 1) { toast('至少保留一个页面'); return; }
  const page = template.pages.find((p) => p.id === id);
  if (!page) return;
  if (!confirm('删除页面「' + page.name + '」？')) return;
  template.pages = template.pages.filter((p) => p.id !== id);
  if (activeId === id) { activeId = template.pages[0].id; clearSel(); }
  snapshot('page:del:' + id, true);
  buildTabs(); render(); populatePanel(null);
  toast('已删除页面');
}

function switchBoard(id) {
  activeId = id;
  clearSel();
  buildTabs();
  render();
  populatePanel(null);
}

async function save() {
  const r = await fetch('/api/template', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(template) });
  const j = await r.json();
  toast(j.ok ? '已保存模板' : '保存失败');
}

async function exportPng() {
  toast('正在渲染…');
  const r = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ template, content: sample }) });
  const j = await r.json();
  if (!j.ok) { toast('渲染失败：' + (j.error || '')); return; }
  toast('已导出，新窗口查看');
  for (const f of j.files) window.open(f.url + '?t=' + Date.now(), '_blank');
}

(async function init() {
  const [t, s] = await Promise.all([fetch('/api/template').then((r) => r.json()), fetch('/api/sample').then((r) => r.json())]);
  template = t; sample = s;
  if (template.artboards && !template.pages) template.pages = template.artboards; // 兼容旧格式
  activeId = template.pages[0].id;
  history = [clone(template)]; index = 0; updateButtons();
  buildTabs();
  render();
  populatePanel(null);
  window.addEventListener('resize', render);
})();

/* ---- 多选 / 复制 / 组合 / 框选 ---- */
let clipboard = [];
function copySel() { const els = selectedEls(); if (!els.length) return; clipboard = els.map((e) => clone(e)); toast('已复制 ' + clipboard.length + ' 个元素'); }
function pasteClip() {
  if (!clipboard.length) return;
  const ab = activeBoard();
  const news = clipboard.map((e) => { const c = clone(e); c.id = 'el-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); c.x += 16; c.y += 16; return c; });
  ab.elements.push(...news);
  selectedIds = news.map((e) => e.id); selectedId = selectedIds[selectedIds.length - 1];
  applySelectionHighlight(); snapshot('paste', true); render(); populatePanel(selectedEl()); toast('已粘贴');
}
function duplicateSel() { copySel(); pasteClip(); }
function groupSel() {
  if (selectedIds.length < 2) { toast('至少选中 2 个元素再组合'); return; }
  const gid = 'g-' + Date.now().toString(36);
  activeBoard().elements.forEach((e) => { if (selectedIds.includes(e.id)) e.group = gid; });
  snapshot('group', true); render(); toast('已组合');
}
function ungroupSel() {
  let n = 0;
  activeBoard().elements.forEach((e) => { if (selectedIds.includes(e.id) && e.group) { e.group = null; n++; } });
  snapshot('ungroup', true); render(); toast(n ? '已取消组合' : '没有组合可选');
}
function startBoxSelect(e) {
  const st = $('stage'); if (!st) return;
  const s = scale();
  const r0 = st.getBoundingClientRect();
  const bx = (e.clientX - r0.left) / s, by = (e.clientY - r0.top) / s;
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;border:1px dashed var(--moss);background:rgba(143,183,154,.12);pointer-events:none;z-index:20;';
  $('board').appendChild(box);
  const move = (ev) => {
    const r = st.getBoundingClientRect();
    const cx = (ev.clientX - r.left) / s, cy = (ev.clientY - r.top) / s;
    box.style.left = Math.min(bx, cx) + 'px'; box.style.top = Math.min(by, cy) + 'px';
    box.style.width = Math.abs(cx - bx) + 'px'; box.style.height = Math.abs(cy - by) + 'px';
  };
  const up = (ev) => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    const r = st.getBoundingClientRect();
    const cx = (ev.clientX - r.left) / s, cy = (ev.clientY - r.top) / s;
    const x1 = Math.min(bx, cx), y1 = Math.min(by, cy), x2 = Math.max(bx, cx), y2 = Math.max(by, cy);
    box.remove();
    const ab = activeBoard();
    const hits = ab.elements.filter((el) => el.visible !== false && !el.locked && el.x < x2 && el.x + el.w > x1 && el.y < y2 && el.y + el.h > y1).map((el) => el.id);
    if (hits.length) { selectedIds = hits; selectedId = hits[hits.length - 1]; applySelectionHighlight(); renderLayers(); renderSelection(); populatePanel(selectedEl()); }
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
}

window.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.key.toLowerCase();
  if (e.key === 'Delete' || e.key === 'Backspace') { if (selectedIds.length) { e.preventDefault(); del(); } return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  else if (k === 'c') { e.preventDefault(); copySel(); }
  else if (k === 'v') { e.preventDefault(); pasteClip(); }
  else if (k === 'd') { e.preventDefault(); duplicateSel(); }
  else if (k === 'g' && !e.shiftKey) { e.preventDefault(); groupSel(); }
  else if (k === 'g' && e.shiftKey) { e.preventDefault(); ungroupSel(); }
});

// 拖拽图片文件到画布 = 上传并新增图片元素
const canvasEl = $('canvas');
canvasEl.addEventListener('dragover', (e) => e.preventDefault());
canvasEl.addEventListener('drop', async (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !/^image\//.test(f.type)) return;
  const s = scale(), ab = activeBoard(), r = $('stage').getBoundingClientRect();
  const x = Math.max(0, Math.min(ab.width - 100, Math.round((e.clientX - r.left) / s)));
  const y = Math.max(0, Math.min(ab.height - 100, Math.round((e.clientY - r.top) / s)));
  toast('上传中…');
  try {
    const res = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
    let j = { ok: false, error: 'HTTP ' + res.status };
    try { j = await res.json(); } catch {}
    if (!j.ok) { toast('上传失败：' + (j.error || '')); return; }
    let w = 400, h = 300;
    try { const n = await naturalSize(f); w = n.w; h = n.h; } catch {}
    const el = { id: 'image-' + Date.now().toString(36), type: 'image', x, y, w, h, src: j.path, fit: 'cover', radius: 12, naturalSize: true };
    ab.elements.push(el);
    snapshot('add:' + el.id, true);
    render();
    select(el.id);
    toast('已添加图片');
  } catch (err) { toast(netMsg(err)); }
});

// 缩放 / 平移 / 复位
function applyPan() { const st = $('stage'); if (st) st.style.transform = `translate(${panX}px,${panY}px)`; }
$('canvas').addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  viewZoom = Math.max(0.2, Math.min(4, viewZoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  render();
}, { passive: false });
$('canvas').addEventListener('dblclick', (e) => {
  if (e.target.closest('.el')) return;
  viewZoom = 1; panX = 0; panY = 0; render(); toast('已复位视图');
});
$('canvas').addEventListener('pointerdown', (e) => {
  if (e.target.closest('.el') || e.target.closest('.rz') || e.target.closest('.rz-rotate')) return;
  if (e.shiftKey) { startBoxSelect(e); return; }
  const sx = e.clientX, sy = e.clientY, ox = panX, oy = panY;
  const move = (ev) => { panX = ox + (ev.clientX - sx); panY = oy + (ev.clientY - sy); applyPan(); };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
});
</script>
